services:
  testexam:
    image: ${DOCKER_REGISTRY-}testexam
    build:
      context: .
      dockerfile: TestExam/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TestExamDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
    ports:
      - "5001:80"
    depends_on:
      - sqlserver
    networks:
      - examnet

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    restart: always
    networks:
      - examnet
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - sqlserver_data:/var/opt/mssql

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./TestExam/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - testexam
    networks:
      - examnet

  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - examnet

networks:
  examnet:
    driver: bridge

volumes:
  jenkins_home:
  sqlserver_data:
